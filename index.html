<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="apple-touch-icon" href="favicon.svg">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Explorer · 我的方向探索工作台</title>
<style>
:root{
  color-scheme: dark;
  --bg:#08090a; --bg-elev:#0b0c0e;
  --panel:#101113; --panel-2:#15161a; --panel-3:#1b1d21;
  --border:rgba(255,255,255,.07); --border-strong:rgba(255,255,255,.13);
  --text:#eceef1; --text-2:#9aa0a8; --text-3:#6a6f78;
  --accent:#6f7bf7; --accent-hover:#828bf9;
  --accent-soft:rgba(111,123,247,.14); --accent-line:rgba(111,123,247,.35);
  --track:rgba(255,255,255,.08);
  --ok:#4ecb8b; --warn:#e8b04e; --danger:#e5645f;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 12px 32px -16px rgba(0,0,0,.7);
  --shadow-sm:0 1px 2px rgba(0,0,0,.3);
  --shadow-lg:0 24px 60px -12px rgba(0,0,0,.7);
  --r-lg:14px; --r-md:10px; --r-sm:7px;
  --sidebar-w:238px;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI","Inter","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono","JetBrains Mono","Cascadia Code",Menlo,Consolas,monospace;
}
:root[data-theme="light"]{
  color-scheme: light;
  --bg:#fbfbfc; --bg-elev:#f6f6f8;
  --panel:#ffffff; --panel-2:#f7f7f9; --panel-3:#f1f1f4;
  --border:rgba(15,18,25,.08); --border-strong:rgba(15,18,25,.16);
  --text:#15171c; --text-2:#5c6270; --text-3:#878d99;
  --accent:#5a67e8; --accent-hover:#4a57d8;
  --accent-soft:rgba(90,103,232,.10); --accent-line:rgba(90,103,232,.35);
  --track:rgba(15,18,25,.07);
  --shadow:0 1px 2px rgba(16,24,40,.05), 0 12px 28px -18px rgba(16,24,40,.28);
  --shadow-sm:0 1px 2px rgba(16,24,40,.06);
  --shadow-lg:0 24px 60px -12px rgba(16,24,40,.22);
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
::selection{background:var(--accent-soft)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:99px;border:3px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:var(--text-3);background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}

.app{display:flex;min-height:100vh;min-height:100dvh}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:50;opacity:0;pointer-events:none;transition:opacity .22s ease;backdrop-filter:blur(2px)}

/* SIDEBAR */
.sidebar{
  width:var(--sidebar-w);flex:0 0 var(--sidebar-w);
  position:sticky;top:0;height:100vh;height:100dvh;
  display:flex;flex-direction:column;
  background:var(--bg-elev);border-right:1px solid var(--border);
  padding:14px 10px 10px;overflow-y:auto;overscroll-behavior:contain;
}
.brand{display:flex;align-items:center;gap:9px;padding:6px 8px 14px}
.brand-mark{width:26px;height:26px;flex:0 0 26px;border-radius:8px;background:linear-gradient(140deg,var(--accent),#a06ff7);display:grid;place-items:center;color:#fff;font-size:13px;font-weight:700;box-shadow:0 2px 10px -2px var(--accent)}
.brand-title{font-size:13.5px;font-weight:600;letter-spacing:-.01em;line-height:1.2}
.brand-sub{font-size:10.5px;color:var(--text-3);letter-spacing:.04em;font-family:var(--mono)}
.nav-group{margin-top:14px}
.nav-label{font-size:10px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--text-3);padding:0 9px;margin-bottom:5px}
.nav-item{display:flex;align-items:center;gap:9px;width:100%;padding:6.5px 9px;border-radius:var(--r-sm);font-size:13.5px;color:var(--text-2);transition:background .13s ease,color .13s ease;text-align:left}
.nav-item:hover{background:var(--panel-2);color:var(--text)}
.nav-item[aria-current="page"]{background:var(--panel-3);color:var(--text);font-weight:500}
.nav-item[aria-current="page"] .nav-dot{background:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.nav-dot{width:5px;height:5px;flex:0 0 5px;border-radius:99px;background:var(--border-strong);transition:background .13s ease,box-shadow .13s ease}
.nav-ico{width:15px;text-align:center;font-size:12.5px;opacity:.85;flex:0 0 15px}
.nav-count{margin-left:auto;font-size:10.5px;color:var(--text-3);font-family:var(--mono);font-variant-numeric:tabular-nums}
.sidebar-foot{margin-top:auto;padding-top:16px}
.journey{border:1px solid var(--border);border-radius:var(--r-md);background:var(--panel);padding:11px 12px}
.journey-head{display:flex;justify-content:space-between;align-items:baseline;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-3);font-weight:600;margin-bottom:9px}
.week-row{display:flex;align-items:center;gap:8px;padding:3.5px 0;font-size:12px;color:var(--text-3)}
.week-row.is-done{color:var(--text-2)}
.week-row.is-active{color:var(--text);font-weight:500}
.week-dot{width:6px;height:6px;border-radius:99px;background:var(--track);border:1px solid var(--border-strong);flex:0 0 6px}
.week-row.is-done .week-dot{background:var(--text-3);border-color:transparent}
.week-row.is-active .week-dot{background:var(--accent);border-color:transparent;box-shadow:0 0 0 3px var(--accent-soft)}
.week-name{font-family:var(--mono);font-size:10.5px;letter-spacing:.03em}

/* MAIN */
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:12px;padding:12px 26px;border-bottom:1px solid var(--border);background:rgba(8,9,10,.78);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
:root[data-theme="light"] .topbar{background:rgba(251,251,252,.82)}
.crumb{display:flex;align-items:baseline;gap:10px;min-width:0}
.crumb-title{font-size:14px;font-weight:600;letter-spacing:-.01em;white-space:nowrap}
.crumb-sub{font-size:12px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar-actions{margin-left:auto;display:flex;align-items:center;gap:7px}
.view{padding:30px 26px 90px;width:100%;max-width:1080px;margin:0 auto;flex:1}

/* PRIMITIVES */
.card{background:var(--panel);border:1px solid var(--border);border-radius:var(--r-lg);padding:18px;box-shadow:var(--shadow-sm)}
.card.pad-lg{padding:22px}
.card.flat{box-shadow:none}
.btn{display:inline-flex;align-items:center;gap:6px;padding:6.5px 12px;border-radius:var(--r-sm);font-size:13px;font-weight:500;border:1px solid var(--border-strong);background:var(--panel-2);color:var(--text);transition:background .13s,border-color .13s;white-space:nowrap}
.btn:hover{background:var(--panel-3);border-color:var(--text-3)}
.btn.primary{background:var(--accent);border-color:transparent;color:#fff}
.btn.primary:hover{background:var(--accent-hover)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--text-2)}
.btn.ghost:hover{background:var(--panel-2);color:var(--text)}
.btn.danger{background:transparent;border-color:transparent;color:var(--danger)}
.btn.danger:hover{background:rgba(229,100,95,.12)}
.btn.sm{padding:4.5px 9px;font-size:12px}
.icon-btn{width:30px;height:30px;display:grid;place-items:center;border-radius:var(--r-sm);border:1px solid transparent;color:var(--text-2);font-size:13px;transition:background .13s,color .13s,border-color .13s}
.icon-btn:hover{background:var(--panel-2);color:var(--text);border-color:var(--border)}
.kbd{font-family:var(--mono);font-size:10.5px;padding:2px 5px;border-radius:5px;border:1px solid var(--border);background:var(--panel-2);color:var(--text-3)}
.tag{display:inline-flex;align-items:center;gap:5px;padding:2.5px 8px;border-radius:99px;font-size:11px;font-weight:500;background:var(--panel-2);border:1px solid var(--border);color:var(--text-2);white-space:nowrap}
.tag.accent{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.tag .tdot{width:5px;height:5px;border-radius:99px;background:currentColor;opacity:.9}
.label{font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--text-3)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--text-2)}
.dim{color:var(--text-3)}
.tiny{font-size:11.5px}
.sm{font-size:12.5px}
.stack{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:10px}
.spread{display:flex;align-items:center;justify-content:space-between;gap:12px}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.section{margin-top:34px}
.section:first-child{margin-top:0}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.section-title{font-size:13px;font-weight:600;letter-spacing:-.005em}
.section-sub{font-size:12px;color:var(--text-3);margin-top:1px}

.meter{height:6px;border-radius:99px;background:var(--track);overflow:hidden;position:relative}
.meter > i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),#9b7bf7);transform-origin:left center;animation:grow .68s cubic-bezier(.22,.8,.24,1) both}
.meter.thin{height:4px}
.meter.thick{height:8px}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}

.stars{display:inline-flex;gap:1.5px;font-size:11.5px;letter-spacing:.5px;line-height:1}
.stars .on{color:var(--warn)}
.stars .off{color:var(--track)}
.dots{display:inline-flex;gap:4px}
.dots i{width:8px;height:8px;border-radius:99px;background:var(--track);transition:background .15s}
.dots i.on{background:var(--accent)}
.dots.interactive i{cursor:pointer;transition:background .15s,transform .12s}
.dots.interactive i:hover{transform:scale(1.28)}

.stat{background:var(--panel);border:1px solid var(--border);border-radius:var(--r-md);padding:13px 14px}
.stat-val{font-size:23px;font-weight:600;letter-spacing:-.025em;line-height:1.1;font-variant-numeric:tabular-nums}
.stat-lab{font-size:11.5px;color:var(--text-3);margin-top:3px}

.hero{background:radial-gradient(120% 140% at 100% 0%, var(--accent-soft) 0%, transparent 55%), var(--panel);border:1px solid var(--border);border-radius:var(--r-lg);padding:26px 24px;box-shadow:var(--shadow-sm)}
.hero h1{margin:0 0 8px;font-size:24px;font-weight:600;letter-spacing:-.028em;line-height:1.25}
.hero p{margin:0;color:var(--text-2);font-size:13.5px;max-width:52ch}

.dir-card{background:var(--panel);border:1px solid var(--border);border-radius:var(--r-lg);padding:16px;display:flex;flex-direction:column;gap:13px;transition:border-color .16s,background .16s;cursor:pointer;text-align:left;width:100%}
.dir-card:hover{border-color:var(--border-strong);background:var(--panel-2)}
.dir-emoji{width:34px;height:34px;border-radius:10px;flex:0 0 34px;display:grid;place-items:center;font-size:17px;background:var(--panel-3);border:1px solid var(--border)}
.dir-name{font-size:14.5px;font-weight:600;letter-spacing:-.012em}
.dir-tags{font-size:11.5px;color:var(--text-3);margin-top:2px;line-height:1.4}
.dir-score{font-size:19px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.dir-score span{font-size:11.5px;color:var(--text-3);font-weight:400}
.score-row{display:grid;grid-template-columns:56px 1fr auto;align-items:center;gap:9px;font-size:12px}
.score-row .k{color:var(--text-3)}
.score-row .v{color:var(--text-2);font-size:11px;font-family:var(--mono);font-variant-numeric:tabular-nums}

.tl{display:flex;flex-direction:column;gap:0}
.tl-item{display:grid;grid-template-columns:15px 1fr;gap:11px;position:relative;padding-bottom:15px}
.tl-item:last-child{padding-bottom:0}
.tl-item::before{content:"";position:absolute;left:6.5px;top:16px;bottom:-2px;width:1px;background:var(--border)}
.tl-item:last-child::before{display:none}
.tl-dot{width:7px;height:7px;border-radius:99px;margin-top:6px;background:var(--panel);border:1.5px solid var(--border-strong);z-index:1}
.tl-item.active .tl-dot{background:var(--accent);border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.tl-item.done .tl-dot{background:var(--text-3);border-color:var(--text-3)}
.tl-title{font-size:12.5px;font-weight:500}
.tl-meta{font-size:11.5px;color:var(--text-3);margin-top:1px}

.act{display:flex;align-items:center;gap:11px;padding:8px 0;border-bottom:1px solid var(--border)}
.act:last-child{border-bottom:none}
.act-date{font-size:11px;color:var(--text-3);font-family:var(--mono);flex:0 0 68px;font-variant-numeric:tabular-nums}
.act-text{font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.task{display:flex;align-items:flex-start;gap:12px;padding:13px 15px;border-radius:var(--r-md);border:1px solid var(--border);background:var(--panel);transition:border-color .15s,opacity .15s;text-align:left;width:100%}
.task:hover{border-color:var(--border-strong)}
.task.done{opacity:.5}
.task.done .task-title{text-decoration:line-through;text-decoration-color:var(--text-3)}
.check{width:17px;height:17px;flex:0 0 17px;margin-top:2px;border-radius:5px;border:1.5px solid var(--border-strong);display:grid;place-items:center;font-size:10px;color:transparent;transition:all .14s}
.check.on{background:var(--accent);border-color:var(--accent);color:#fff}
.task-kind{font-size:10px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--text-3);font-family:var(--mono)}
.task-title{font-size:13.5px;font-weight:500;margin-top:1px;letter-spacing:-.005em}
.task-min{font-size:11px;color:var(--text-3);font-family:var(--mono);margin-top:2px;font-variant-numeric:tabular-nums}

.cal-head{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:6px}
.cal-dow{font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--text-3);text-align:center;padding:5px 0}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal-cell{min-height:74px;border-radius:var(--r-md);border:1px solid var(--border);background:var(--panel);padding:7px 8px;text-align:left;display:flex;flex-direction:column;gap:5px;transition:border-color .14s,background .14s;position:relative}
.cal-cell.empty{background:transparent;border-color:transparent;pointer-events:none}
.cal-cell.has-plan{cursor:pointer}
.cal-cell.has-plan:hover{border-color:var(--border-strong);background:var(--panel-2)}
.cal-cell.today{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent-soft)}
.cal-cell.today .cal-date{color:var(--accent);font-weight:600}
.cal-cell.active{background:var(--panel-3);border-color:var(--border-strong)}
.cal-date{font-size:11.5px;color:var(--text-3);font-family:var(--mono);font-variant-numeric:tabular-nums}
.cal-pill{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;padding:2px 6px;border-radius:5px;background:var(--panel-3);color:var(--text-2);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border:1px solid var(--border)}
.cal-pill .pd{width:4px;height:4px;border-radius:99px;flex:0 0 4px}
.cal-theme{font-size:10.5px;color:var(--text-3);line-height:1.3;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.cal-today-flag{position:absolute;top:6px;right:7px;font-size:9px;font-weight:700;letter-spacing:.06em;color:var(--accent)}

.tbl-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--r-lg);background:var(--panel)}
table.tbl{width:100%;border-collapse:collapse;font-size:12.5px;min-width:620px}
table.tbl th{text-align:left;padding:10px 12px;font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--text-3);border-bottom:1px solid var(--border);white-space:nowrap;background:var(--panel-2)}
table.tbl th.c,table.tbl td.c{text-align:center}
table.tbl td{padding:9px 12px;border-bottom:1px solid var(--border)}
table.tbl tr:last-child td{border-bottom:none}
table.tbl tbody tr:hover{background:var(--panel-2)}
.cell-score{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:6px;font-family:var(--mono);font-size:11.5px;font-variant-numeric:tabular-nums;background:var(--panel-3);color:var(--text-2);cursor:pointer;transition:background .12s,color .12s,border-color .12s;border:1px solid transparent}
.cell-score:hover{border-color:var(--border-strong);color:var(--text)}
.cell-score.hi{background:var(--accent-soft);color:var(--accent)}
.cell-score.mid{background:rgba(232,176,78,.12);color:var(--warn)}

.field{margin-bottom:14px}
.field:last-child{margin-bottom:0}
.field-lab{display:block;font-size:12px;font-weight:500;color:var(--text-2);margin-bottom:6px}
.field-hint{font-size:11px;color:var(--text-3);margin-top:5px}
.input,.textarea{width:100%;padding:9px 11px;border-radius:var(--r-sm);background:var(--panel-2);border:1px solid var(--border);font-size:13px;line-height:1.55;transition:border-color .14s,background .14s,box-shadow .14s}
.input::placeholder,.textarea::placeholder{color:var(--text-3)}
.input:focus,.textarea:focus{outline:none;border-color:var(--accent);background:var(--panel);box-shadow:0 0 0 3px var(--accent-soft)}
.input.invalid,.textarea.invalid{border-color:var(--danger);box-shadow:0 0 0 3px rgba(229,100,95,.15)}
.textarea{resize:vertical;min-height:74px;font-family:var(--font)}
select.input{cursor:pointer;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--text-3) 50%),linear-gradient(135deg,var(--text-3) 50%,transparent 50%);background-position:calc(100% - 15px) 50%,calc(100% - 10px) 50%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:30px}
input[type="date"].input{font-family:var(--mono);font-size:12.5px}
.range{width:100%;height:6px;border-radius:99px;appearance:none;background:var(--track);outline:none;margin-top:6px}
.range::-webkit-slider-thumb{appearance:none;width:16px;height:16px;border-radius:99px;background:var(--accent);cursor:pointer;border:2px solid var(--panel);box-shadow:0 0 0 1px var(--accent)}
.range::-moz-range-thumb{width:14px;height:14px;border-radius:99px;background:var(--accent);cursor:pointer;border:2px solid var(--panel)}
.range-row{display:flex;align-items:center;gap:12px}
.range-val{font-size:13px;font-weight:600;color:var(--accent);font-family:var(--mono);width:22px;text-align:right;flex:0 0 22px}

.exp{background:var(--panel);border:1px solid var(--border);border-radius:var(--r-lg);padding:16px;display:flex;flex-direction:column;gap:12px}
.exp-title{font-size:14px;font-weight:600;letter-spacing:-.01em}
.exp-block{border-left:2px solid var(--border);padding-left:11px}
.exp-block .bk{font-size:10px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--text-3)}
.exp-block .bv{font-size:12.5px;color:var(--text-2);margin-top:2px;line-height:1.5;white-space:pre-wrap}

.career-card{background:var(--panel);border:1px solid var(--border);border-radius:var(--r-lg);padding:16px;display:flex;flex-direction:column;gap:11px}
.career-name{font-size:14px;font-weight:600;letter-spacing:-.01em}

.q-item{display:flex;align-items:flex-start;gap:12px;padding:13px 15px;border:1px solid var(--border);border-radius:var(--r-md);background:var(--panel);transition:border-color .14s}
.q-item:hover{border-color:var(--border-strong)}
.q-text{font-size:13.5px;line-height:1.5;letter-spacing:-.005em}
.status-pill{font-size:10.5px;padding:2.5px 8px;border-radius:99px;font-weight:500;border:1px solid var(--border);background:var(--panel-2);color:var(--text-2);white-space:nowrap;flex:0 0 auto;cursor:pointer;transition:background .13s,color .13s}
.status-pill:hover{background:var(--panel-3);color:var(--text)}
.status-pill.s-curious{color:var(--accent);background:var(--accent-soft);border-color:transparent}
.status-pill.s-doing{color:var(--warn);background:rgba(232,176,78,.12);border-color:transparent}

.tree-branch{display:flex;gap:34px;position:relative;padding-top:20px}

.tree-branch::after{content:"";position:absolute;top:0;left:50%;transform:translateX(-50%);width:1px;height:20px;background:var(--border-strong)}
.tree-col{display:flex;flex-direction:column;align-items:center;gap:0;position:relative;padding-top:20px}
.tree-col::before{content:"";position:absolute;top:0;left:50%;width:1px;height:20px;background:var(--border-strong)}

.rank-card{display:flex;align-items:center;gap:14px;border:1px solid var(--border);border-radius:var(--r-lg);background:var(--panel);padding:15px 16px}

.empty{border:1px dashed var(--border-strong);border-radius:var(--r-md);padding:26px;text-align:center;color:var(--text-3);font-size:12.5px}

/* MODAL */
.modal-layer{position:fixed;inset:0;z-index:90;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(0,0,0,.5);backdrop-filter:blur(3px)}
.modal-layer.open{display:flex}
.modal{width:min(560px,96vw);max-height:88vh;display:flex;flex-direction:column;border-radius:var(--r-lg);border:1px solid var(--border-strong);background:var(--panel);box-shadow:var(--shadow-lg);animation:pop .18s cubic-bezier(.2,.9,.3,1.1);overflow:hidden}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:15px 18px;border-bottom:1px solid var(--border)}
.modal-title{font-size:14.5px;font-weight:600;letter-spacing:-.01em}
.modal-body{padding:18px;overflow-y:auto;flex:1}
.modal-foot{display:flex;justify-content:flex-end;gap:8px;padding:13px 18px;border-top:1px solid var(--border);background:var(--panel-2)}
@keyframes pop{from{opacity:0;transform:translateY(-6px) scale(.985)}to{opacity:1;transform:none}}

.toast-layer{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:110;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{padding:9px 16px;border-radius:99px;background:var(--panel-3);border:1px solid var(--border-strong);color:var(--text);font-size:12.5px;font-weight:500;box-shadow:var(--shadow);opacity:0;transform:translateY(8px);transition:opacity .22s,transform .22s;white-space:nowrap}

.toast.err{border-color:rgba(229,100,95,.4);color:var(--danger)}

function isoOf(d){ return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
function parseISO(s){ const [y, m, d] = String(s).split('-').map(Number); return new Date(y, m - 1, d); }

function prettyFull(s){
  const d = parseISO(s);

  return `${d.getFullYear()} 年 ${d.getMonth()+1} 月 ${d.getDate()} 日 · ${wd}`;

const KEY = 'obsidian-explorer-v3';
let S = null;

function deepClone(o){ try { return JSON.parse(JSON.stringify(o)); } catch(e){ return o; } }

function mergeWithDefaults(parsed){
  const base = defaultState();
  if (!parsed || typeof parsed !== 'object') return base;
  const out = Object.assign(base, parsed);
  out.meta = Object.assign(base.meta, parsed.meta || {});
  out.calView = Object.assign(base.calView, parsed.calView || {});
  out.decision = Object.assign(base.decision, parsed.decision || {});
  out.daily = parsed.daily || {};
  out.directions = (parsed.directions || base.directions).map(d => ({
    id: d.id || uid('d'),
    name: d.name || '未命名方向',
    emoji: d.emoji || '◇',
    tags: Array.isArray(d.tags) ? d.tags : [],
    blurb: d.blurb || '',
    scores: Object.assign({ interest:3,curiosity:3,continue:3,build:3,math:3,research:3,product:3,career:3 }, d.scores || {}),
    log: Array.isArray(d.log) ? d.log.map(l => ({
      id: l.id || uid('l'), d: l.d || isoOf(new Date()), t: l.t || ''
    })) : []
  }));
  out.experiments = (parsed.experiments || base.experiments).map(x => ({
    id: x.id || uid('x'),
    title: x.title || '未命名实验',
    dir: x.dir || (out.directions[0] && out.directions[0].id) || '',
    status: ['planned','doing','done'].includes(x.status) ? x.status : 'planned',
    date: x.date || '',
    hyp: x.hyp || '', problem: x.problem || '',
    result: x.result || '', reflect: x.reflect || '',
    score: Number(x.score) || 0
  }));
  out.career = (parsed.career || base.career).map(c => ({
    id: c.id || uid('c'),
    name: c.name || '未命名职业',
    dir: c.dir || '',
    fit: Number(c.fit) || 3,
    real: c.real || '', tryIt: c.tryIt || ''
  }));
  out.research = (parsed.research || base.research).map(q => ({
    id: q.id || uid('q'),
    q: q.q || q.text || '',
    dir: q.dir || '',
    status: ['curious','doing','done'].includes(q.status) ? q.status : 'curious'
  })).filter(q => q.q);
  return out;
}

function loadState(){
  try {
    const raw = localStorage.getItem(KEY);
    if (!raw) return defaultState();
    return mergeWithDefaults(JSON.parse(raw));
  } catch(e){ console.warn('读取失败', e); return defaultState(); }
}

let backupTimer = null;
function scheduleBackup(){
  clearTimeout(backupTimer);
  backupTimer = setTimeout(() => {
    fetch('/api/save', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(S)
    }).catch(() => { /* 没有本地服务器时静默失败 */ });
  }, 700);
}

function save(){
  try { localStorage.setItem(KEY, JSON.stringify(S)); }
  catch(e){ console.warn('localStorage 保存失败', e); }
  scheduleBackup();
}

/* ---- 便捷函数 ---- */
function dirById(id){ return S.directions.find(d => d.id === id); }
function dirScore(d){
  const vals = SCORE_KEYS.map(x => d.scores[x.k] || 0);
  return vals.reduce((a, b) => a + b, 0) / vals.length;
}
function sortedDirections(){ return S.directions.slice().sort((a, b) => dirScore(b) - dirScore(a)); }
function getDay(date){
  if (!S.daily[date]) S.daily[date] = { done:{}, discover:'', best:'', worst:'', keep:0, conclusion:'' };
  return S.daily[date];
}
function allActivity(){
  const items = [];
  S.directions.forEach(d => (d.log || []).forEach(l => items.push({ d:l.d, t:l.t, dir:d.id })));
  S.experiments.forEach(x => { if (x.date) items.push({ d:x.date, t:x.title, dir:x.dir }); });
  items.sort((a, b) => b.d.localeCompare(a.d));
  return items.slice(0, 8);
}
function weekProgress(){
  const elapsed = daysBetween(START_DATE, TODAY);
  if (elapsed < 0) return 0;
  return clamp(elapsed / 28, 0, 1);
}

let modalSubmitFn = null;

function fieldHTML(f, v){
  const val = v !== undefined && v !== null ? v : (f.default !== undefined ? f.default : '');
  const req = f.required ? ' <span style="color:var(--danger)">*</span>' : '';
  const hint = f.hint ? `<div class="field-hint">${esc(f.hint)}</div>` : '';
  if (f.type === 'textarea'){
    return `<div class="field"><label class="field-lab">${esc(f.label)}${req}</label>
      <textarea class="textarea" name="${esc(f.key)}" placeholder="${esc(f.placeholder || '')}">${esc(val)}</textarea>${hint}</div>`;
  }
  if (f.type === 'select'){
    const opts = (f.options || []).map(o =>
      `<option value="${esc(o.value)}"${String(o.value) === String(val) ? ' selected' : ''}>${esc(o.label)}</option>`
    ).join('');
    return `<div class="field"><label class="field-lab">${esc(f.label)}${req}</label>
      <select class="input" name="${esc(f.key)}">${opts}</select>${hint}</div>`;
  }
  if (f.type === 'rating'){
    const num = Number(val) || 3;
    return `<div class="field"><label class="field-lab">${esc(f.label)}${req}</label>
      <div class="range-row">
        <input type="range" class="range" name="${esc(f.key)}" min="1" max="5" step="1" value="${num}"
          oninput="this.closest('.range-row').querySelector('.range-val').textContent=this.value">
        <span class="range-val">${num}</span>
      </div>${hint}</div>`;
  }
  if (f.type === 'date'){
    return `<div class="field"><label class="field-lab">${esc(f.label)}${req}</label>
      <input type="date" class="input" name="${esc(f.key)}" value="${esc(val)}">${hint}</div>`;
  }
  return `<div class="field"><label class="field-lab">${esc(f.label)}${req}</label>
    <input type="text" class="input" name="${esc(f.key)}" value="${esc(val)}" placeholder="${esc(f.placeholder || '')}">${hint}</div>`;
}

function openModal(opts){
  const layer = $('#modalLayer');
  const fields = opts.fields || [];
  const values = opts.values || {};

  let bodyHTML;
  if (opts.message){
    bodyHTML = `<p style="font-size:13.5px;color:var(--text-2);line-height:1.6;margin:0">${esc(opts.message)}</p>`;
  } else {
    bodyHTML = fields.map(f => fieldHTML(f, values[f.key])).join('');
  }

  layer.innerHTML = `
    <div class="modal-backdrop" data-action="modal-close" style="position:absolute;inset:0"></div>
    <div class="modal" style="position:relative">
      <div class="modal-head">
        <div class="modal-title">${esc(opts.title || '')}</div>
        <button class="icon-btn" data-action="modal-close" aria-label="关闭">✕</button>
      </div>
      <div class="modal-body">${bodyHTML}</div>
      <div class="modal-foot">
        <button class="btn ghost" data-action="modal-close">${esc(opts.cancelText || '取消')}</button>
        <button class="btn ${opts.danger ? 'danger' : 'primary'}" id="modalSubmit">${esc(opts.submitText || '保存')}</button>
      </div>
    </div>`;
  layer.classList.add('open');

  modalSubmitFn = () => {
    if (opts.message){
      closeModal();
      if (opts.onSubmit) opts.onSubmit({});
      return;
    }
    const data = {};
    let valid = true;
    fields.forEach(f => {
      const el = layer.querySelector(`[name="${f.key}"]`);
      if (!el) return;
      const v = f.type === 'rating' ? Number(el.value) : el.value;
      if (f.required && (v === '' || v === null || v === undefined)){
        valid = false;
        el.classList.add('invalid');
      } else {
        el.classList.remove('invalid');
      }
      data[f.key] = v;
    });
    if (!valid){ toast('请填写必填项', 'warn'); return; }
    closeModal();
    if (opts.onSubmit) opts.onSubmit(data);
  };
  $('#modalSubmit').onclick = modalSubmitFn;

  setTimeout(() => {
    const first = layer.querySelector('input:not([type="range"]), textarea, select');
    if (first) first.focus();
  }, 50);
}

function closeModal(){
  const layer = $('#modalLayer');
  layer.classList.remove('open');
  layer.innerHTML = '';
  modalSubmitFn = null;
}

function confirmDialog(opts){
  openModal({
    title: opts.title || '确认',
    message: opts.message || '确定要执行吗？',
    submitText: opts.submitText || '确认',
    danger: true,
    onSubmit: () => { if (opts.onConfirm) opts.onConfirm(); }
  });
}

function parseHash(){
  const h = location.hash.replace(/^#\/?/, '');
  const parts = h.split('/').filter(Boolean);
  return { name: parts[0] || 'dashboard', param: parts.slice(1).join('/') };
}
function go(hash){ location.hash = hash; }

function render(){
  const { name, param } = parseHash();
  const view = $('#view');
  let html = '';
  switch(name){
    case 'today':       html = renderToday(); break;
    case 'calendar':    html = renderCalendar(); break;
    case 'experiments': html = renderExperiments(); break;
    case 'directions':  html = renderDirections(); break;
    case 'direction':   html = renderDirectionDetail(param); break;
    case 'career':      html = renderCareer(); break;
    case 'research':    html = renderResearch(); break;
    case 'decision':    html = renderDecision(); break;
    default:            html = renderDashboard();
  }
  view.innerHTML = html;

  const t = TITLES[name] || TITLES.dashboard;
  let title = t[0], sub = t[1];
  if (name === 'direction'){
    const d = dirById(param);
    title = d ? d.name : '方向详情';
    sub = d ? (d.tags || []).join(' · ') : '';
  }
  $('#crumbTitle').textContent = title;
  $('#crumbSub').textContent = sub;

  $$('#nav .nav-item').forEach(b => {
    const r = b.dataset.route;
    const on = (r === name) || (name === 'direction' && r === 'directions');
    if (on) b.setAttribute('aria-current', 'page');
    else b.removeAttribute('aria-current');
  });

  $('#navExpCount').textContent = S.experiments.length;
  $('#navDirCount').textContent = S.directions.length;
  $('#navQCount').textContent = S.research.length;

  $('#app').classList.remove('nav-open');
  window.scrollTo({ top: 0, behavior: 'auto' });
}

  const pct = Math.round(weekProgress() * 100);

    const done = TODAY > w.to;
    const active = TODAY >= w.from && TODAY <= w.to;
    const cls = done ? 'is-done' : (active ? 'is-active' : '');
    return `<div class="week-row ${cls}">
      <span class="week-dot"></span>
      <span class="week-name">WEEK ${w.n}</span>
      <span style="margin-left:auto;font-size:11px;opacity:.8;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(w.name)}</span>
    </div>`;
  }).join('');

  const bsub = $('#brandSub');

}

function renderToday(){
  const date = S.activeDay || START_DATE;
  const plan = PLAN[date];
  const day = getDay(date);
  const dir = plan ? dirById(plan.dir) : null;

  const tasksHTML = plan ? plan.tasks.map((t, i) => {
    const done = !!day.done[i];
    return `<div class="task ${done ? 'done' : ''}" data-action="toggle-task" data-date="${date}" data-idx="${i}" role="button" tabindex="0">
      <span class="check ${done ? 'on' : ''}">✓</span>
      <div style="min-width:0">
        <div class="task-kind">${pad2(i+1)} · ${esc(t.k)}</div>
        <div class="task-title">${esc(t.t)}</div>
        <div class="task-min">${t.m} min</div>
      </div>
    </div>`;
  }).join('') : '<div class="empty">这一天没有安排任务</div>';

  const totalMin = plan ? plan.tasks.reduce((a, b) => a + b.m, 0) : 0;
  const doneCount = plan ? plan.tasks.filter((_, i) => day.done[i]).length : 0;
  const pct = plan && plan.tasks.length ? Math.round(doneCount / plan.tasks.length * 100) : 0;

  const expForDay = S.experiments.filter(x => x.date === date);

  return `
  <div class="spread" style="margin-bottom:16px">
    <div>
      <div class="label">TODAY'S MISSION</div>

    </div>
    <div class="row" style="gap:8px">
      <button class="btn ghost sm" data-action="prev-day">←</button>
      <button class="btn ghost sm" data-action="jump-today">回到今天</button>

      <div class="row" style="gap:10px">
        <span style="width:7px;height:7px;border-radius:99px;background:${dirColor(plan.dir)}"></span>

        ${dir ? `<span class="tiny dim">· ${esc(dir.name)}</span>` : ''}

    <div style="margin-top:10px">${meterHTML(pct, 'thin')}</div>

      </div>
    </div>
    <div class="card pad-lg">
      <div class="field">

function keepLabel(v){
  return ['还没想','完全不想','有点犹豫','还行','想继续','非常想继续'][v] || '还没想';
}

/* ============================================================
   页面：月历
   ============================================================ */
function renderCalendar(){
  const { y, m } = S.calView;
  const first = new Date(y, m, 1);
  const startDow = (first.getDay() + 6) % 7;
  const daysInMonth = new Date(y, m + 1, 0).getDate();

  const cells = [];
  for (let i = 0; i < startDow; i++) cells.push('<div class="cal-cell empty"></div>');
  for (let d = 1; d <= daysInMonth; d++){
    const dateStr = `${y}-${pad2(m+1)}-${pad2(d)}`;
    const plan = PLAN[dateStr];
    const isToday = dateStr === TODAY;
    const isActive = dateStr === S.activeDay;
    const cls = ['cal-cell', plan ? 'has-plan' : '', isToday ? 'today' : '', isActive ? 'active' : ''].filter(Boolean).join(' ');
    cells.push(`<div class="${cls}" ${plan ? `data-action="open-day" data-date="${dateStr}"` : ''} ${plan ? 'role="button" tabindex="0"' : ''}>
      ${isToday ? '<span class="cal-today-flag">TODAY</span>' : ''}
      <span class="cal-date">${d}</span>
      ${plan ? `<span class="cal-pill"><span class="pd" style="background:${dirColor(plan.dir)}"></span>${esc(plan.label)}</span>
      <span class="cal-theme">${esc(plan.theme)}</span>` : ''}
    </div>`);
  }
  const monthName = first.toLocaleDateString('zh-CN', { year:'numeric', month:'long' });

  return `
  <div class="spread" style="margin-bottom:16px">
    <div>
      <div class="label">MONTHLY CALENDAR</div>
      <h2 style="margin:6px 0 0;font-size:20px;font-weight:600;letter-spacing:-.025em">${monthName}</h2>
    </div>
    <div class="row" style="gap:6px">
      <button class="btn ghost sm" data-action="cal-prev">←</button>
      <button class="btn ghost sm" data-action="cal-now">本月</button>
      <button class="btn ghost sm" data-action="cal-next">→</button>
    </div>
  </div>

  <div class="card" style="padding:14px">
    <div class="cal-head">
      ${['MON','TUE','WED','THU','FRI','SAT','SUN'].map(d => `<div class="cal-dow">${d}</div>`).join('')}
    </div>
    <div class="cal-grid">${cells.join('')}</div>
  </div>

  <section class="section">
    <div class="section-head">
      <div>
        <div class="section-title">4 周结构</div>
        <div class="section-sub">每周有一个明确的目的，不是一个待办清单</div>
      </div>
    </div>
    <div class="grid g2">
      ${WEEKS.map(w => {
        const days = PLAN_DAYS.filter(d => d >= w.from && d <= w.to);
        return `<div class="card">
          <div class="row" style="gap:9px;margin-bottom:9px">
            <span class="tag accent">WEEK ${w.n}</span>
            <span class="sm" style="font-weight:500">${esc(w.name)}</span>
          </div>
          <div class="stack" style="gap:5px">
            ${days.map(d => {
              const p = PLAN[d];
              return `<button class="row" style="gap:8px;width:100%;text-align:left;padding:3px 0" data-action="open-day" data-date="${d}">
                <span class="tiny mono dim" style="flex:0 0 44px">${d.slice(5)}</span>
                <span style="width:5px;height:5px;border-radius:99px;background:${dirColor(p.dir)};flex:0 0 5px"></span>
                <span class="tiny muted" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(p.theme)}</span>
              </button>`;
            }).join('')}
          </div>
        </div>`;
      }).join('')}
    </div>
  </section>
  `;
}

/* ============================================================
   实验卡片 + 页面
   ============================================================ */
function expCardHTML(x){
  const d = dirById(x.dir);
  const statusMap = { done:['已完成','s-done'], doing:['进行中','s-doing'], planned:['计划中',''] };
  const st = statusMap[x.status] || statusMap.planned;
  const blocks = [
    x.hyp     && ['Hypothesis', x.hyp],
    x.problem && ['Problem',    x.problem],
    x.result  && ['Result',     x.result],
    x.reflect && ['Reflection', x.reflect]
  ].filter(Boolean);

  return `<div class="exp">
    <div class="spread" style="align-items:flex-start">
      <div style="min-width:0;flex:1">
        <div class="exp-title">${esc(x.title)}</div>
        <div class="tiny dim" style="margin-top:3px">${d ? esc(d.name) : '未分类'}${x.date ? ' · ' + prettyDate(x.date) : ''}</div>
      </div>
      <span class="status-pill ${st[1]}">${st[0]}</span>
    </div>

    ${blocks.map(b => `<div class="exp-block"><div class="bk">${b[0]}</div><div class="bv">${esc(b[1])}</div></div>`).join('')}

    <div class="spread" style="padding-top:11px;border-top:1px solid var(--border)">
      <span class="tiny dim">我会再做一次吗</span>
      <span class="row" style="gap:8px">${starsHTML(x.score)}</span>
    </div>

    <div class="row" style="gap:6px;flex-wrap:wrap">
      <button class="btn ghost sm" data-action="edit-exp" data-id="${x.id}">编辑</button>
      <button class="btn ghost sm" data-action="cycle-exp" data-id="${x.id}">切换状态</button>
      <button class="btn danger sm" data-action="del-exp" data-id="${x.id}">删除</button>
    </div>
  </div>`;
}

function renderExperiments(){
  const groups = { doing:[], planned:[], done:[] };
  S.experiments.forEach(x => { (groups[x.status] || groups.planned).push(x); });
  const countBy = id => S.experiments.filter(x => x.dir === id).length;

  return `
  <div class="spread" style="margin-bottom:16px">
    <div>
      <div class="label">BUILD LAB</div>
      <h2 style="margin:6px 0 0;font-size:20px;font-weight:600;letter-spacing:-.025em">实验项目</h2>
      <div class="tiny dim" style="margin-top:4px">重点不是学习某个学科，而是做一件 2 小时能做完的事</div>
    </div>
    <button class="btn primary" data-action="new-exp">+ 新建实验</button>
  </div>

  ${['doing','planned','done'].map(k => {
    if (!groups[k].length) return '';
    const names = { doing:'进行中', planned:'计划中', done:'已完成' };
    return `<section class="section">
      <div class="section-head">
        <div class="section-title">${names[k]} <span class="dim mono tiny">${groups[k].length}</span></div>
      </div>
      <div class="grid g2">${groups[k].map(expCardHTML).join('')}</div>
    </section>`;
  }).join('')}

  ${!S.experiments.length ? '<div class="empty">还没有实验。点右上角新建一个。</div>' : ''}

  <section class="section">
    <div class="section-head">
      <div>
        <div class="section-title">实验分布</div>
        <div class="section-sub">哪个方向你实际动手最多</div>
      </div>
    </div>
    <div class="card">
      ${S.directions.map(d => {
        const n = countBy(d.id);

        return `<div style="padding:9px 0">
          <div class="spread" style="margin-bottom:6px">
            <span class="sm">${esc(d.name)}</span>
            <span class="tiny mono dim">${n}</span>
          </div>
          ${meterHTML(pct, 'thin')}
        </div>`;
      }).join('')}
    </div>
  </section>
  `;
}

/* ============================================================
   事件处理
   ============================================================ */
document.addEventListener('click', e => {
  /* 路由 */
  const routeEl = e.target.closest('[data-route]');
  if (routeEl){ e.preventDefault(); go('#/' + routeEl.dataset.route); return; }

  /* 动作 */
  const el = e.target.closest('[data-action]');
  if (!el) return;
  const a = el.dataset.action;
  e.preventDefault();

  switch(a){
    case 'toggle-nav': $('#app').classList.toggle('nav-open'); break;
    case 'close-nav':  $('#app').classList.remove('nav-open'); break;

    case 'toggle-theme':
      S.theme = S.theme === 'dark' ? 'light' : 'dark';
      document.documentElement.dataset.theme = S.theme;
      save(); render(); break;

    case 'modal-close': closeModal(); break;

    case 'open-dir': go('#/direction/' + el.dataset.id); break;

    case 'open-day':
      S.activeDay = el.dataset.date;
      save(); go('#/today'); break;

    case 'jump-today': {
      const target = PLAN[TODAY] ? TODAY : START_DATE;
      S.activeDay = target; save(); render(); break;
    }
    case 'prev-day': {
      const i = PLAN_DAYS.indexOf(S.activeDay);
      S.activeDay = PLAN_DAYS[Math.max(0, i - 1)] || PLAN_DAYS[0];
      save(); render(); break;
    }
    case 'next-day': {
      const i = PLAN_DAYS.indexOf(S.activeDay);
      S.activeDay = PLAN_DAYS[Math.min(PLAN_DAYS.length - 1, i + 1)] || PLAN_DAYS[PLAN_DAYS.length - 1];
      save(); render(); break;
    }

    case 'cal-prev': {
      let { y, m } = S.calView;
      m--; if (m < 0){ m = 11; y--; }
      S.calView = { y, m }; save(); render(); break;
    }
    case 'cal-next': {
      let { y, m } = S.calView;
      m++; if (m > 11){ m = 0; y++; }
      S.calView = { y, m }; save(); render(); break;
    }
    case 'cal-now': S.calView = { y: 2026, m: 8 }; save(); render(); break;

    case 'toggle-task': {
      const date = el.dataset.date, idx = el.dataset.idx;
      const day = getDay(date);
      day.done[idx] = !day.done[idx];
      save(); render(); break;
    }
    case 'set-keep': {
      const v = Number(el.dataset.value);
      const date = el.dataset.date;
      getDay(date).keep = v;
      save(); render(); break;
    }
    case 'save-day': {
      save();
      const hint = $('#saveHint');
      if (hint){ hint.textContent = '已保存 ✓'; setTimeout(() => { hint.textContent = ''; }, 1800); }
      break;
    }
    case 'add-log': {
      const date = el.dataset.date;
      const day = getDay(date);
      const plan = PLAN[date];
      const dir = plan ? dirById(plan.dir) : sortedDirections()[0];
      if (!dir){ toast('没有可记录的方向', 'warn'); break; }
      const text = day.discover || (plan ? plan.theme : '一次探索');
      dir.log = dir.log || [];
      dir.log.unshift({ id: uid('l'), d: date, t: text });
      save(); render();
      toast('已记入「' + dir.name + '」', 'ok');
      break;
    }

    /* ---- 评分 ---- */
    case 'bump-score': {
      const d = dirById(el.dataset.id);
      const k = el.dataset.key;
      d.scores[k] = (d.scores[k] || 0) >= 5 ? 1 : (d.scores[k] || 0) + 1;
      save(); render(); break;
    }
    case 'set-score': {
      const d = dirById(el.dataset.id);
      const k = el.dataset.key;
      const v = Number(e.target.dataset.value);
      if (v){ d.scores[k] = v; save(); render(); }
      break;
    }

    /* ---- 方向 CRUD ---- */
    case 'new-dir': openDirModal(null); break;
    case 'edit-dir': openDirModal(el.dataset.id); break;
    case 'del-dir': {
      const d = dirById(el.dataset.id);
      if (!d) break;
      confirmDialog({
        title: '删除方向',
        message: `确定删除「${d.name}」吗？它的探索记录也会一起消失。相关实验会保留。`,
        submitText: '删除',
        onConfirm: () => {
          S.directions = S.directions.filter(v => v.id !== d.id);
          save(); render();
          toast('已删除', 'ok');
        }
      });
      break;
    }
    case 'new-log': openLogModal(el.dataset.id); break;
    case 'del-log': {
      const d = dirById(el.dataset.id);
      d.log = (d.log || []).filter(l => l.id !== el.dataset.log);
      save(); render(); break;
    }

    /* ---- 实验 ---- */
    case 'new-exp': openExpModal(null); break;
    case 'edit-exp': openExpModal(el.dataset.id); break;
    case 'cycle-exp': {
      const x = S.experiments.find(v => v.id === el.dataset.id);
      const order = ['planned', 'doing', 'done'];
      x.status = order[(order.indexOf(x.status) + 1) % 3];
      save(); render(); break;
    }
    case 'del-exp': {
      const x = S.experiments.find(v => v.id === el.dataset.id);
      if (!x) break;
      confirmDialog({
        title: '删除实验',
        message: `确定删除「${x.title}」吗？`,
        submitText: '删除',
        onConfirm: () => {
          S.experiments = S.experiments.filter(v => v.id !== x.id);
          save(); render();
          toast('已删除', 'ok');
        }
      });
      break;
    }

    /* ---- 职业 ---- */
    case 'new-career': openCareerModal(null); break;
    case 'edit-career': openCareerModal(el.dataset.id); break;
    case 'del-career': {
      const c = S.career.find(v => v.id === el.dataset.id);
      if (!c) break;
      confirmDialog({
        title: '删除职业',
        message: `确定删除「${c.name}」吗？`,
        submitText: '删除',
        onConfirm: () => {
          S.career = S.career.filter(v => v.id !== c.id);
          save(); render();
          toast('已删除', 'ok');
        }
      });
      break;
    }

    /* ---- 研究问题 ---- */
    case 'new-q': openQModal(null); break;
    case 'edit-q': openQModal(el.dataset.id); break;
    case 'cycle-q': {
      const q = S.research.find(v => v.id === el.dataset.id);
      const order = ['curious', 'doing', 'done'];
      q.status = order[(order.indexOf(q.status) + 1) % 3];
      save(); render(); break;
    }
    case 'del-q': {
      const q = S.research.find(v => v.id === el.dataset.id);
      if (!q) break;
      confirmDialog({
        title: '删除问题',
        message: `确定删除「${q.q}」吗？`,
        submitText: '删除',
        onConfirm: () => {
          S.research = S.research.filter(v => v.id !== q.id);
          save(); render();
          toast('已删除', 'ok');
        }
      });
      break;
    }

    /* ---- 导出 / 导入 ---- */
    case 'export-data': {
      const payload = {
        app: 'obsidian-explorer', version: 3,
        exportedAt: new Date().toISOString(),
        data: S
      };
      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = 'explorer-backup-' + TODAY + '.json';
      document.body.appendChild(link); link.click(); link.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
      toast('已导出', 'ok');
      break;
    }
    case 'import-data': $('#importFile').click(); break;

    /* ---- 命令面板 ---- */
    case 'palette': openPalette(); break;
    case 'palette-close': closePalette(); break;
  }
});

/* 键盘 */
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' || e.key === ' '){
    const t = e.target.closest('.task');
    if (t){ e.preventDefault(); t.click(); }
    const c = e.target.closest('.cal-cell.has-plan');
    if (c){ e.preventDefault(); c.click(); }
  }
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k'){
    e.preventDefault();
    const open = $('#paletteLayer') && $('#paletteLayer').classList.contains('open');
    if (open) closePalette(); else openPalette();
  }
  if (e.key === 'Escape'){
    closeModal();
    closePalette();
  }
});

/* 输入自动保存 */
let inputTimer = null;
document.addEventListener('input', e => {
  const f = e.target.closest('[data-field]');
  if (f){
    const date = f.dataset.date;
    const day = getDay(date);
    day[f.dataset.field] = f.value;
    clearTimeout(inputTimer);
    inputTimer = setTimeout(save, 300);
    return;
  }
});

/* 导入文件 */
document.addEventListener('change', e => {
  if (e.target.id !== 'importFile') return;
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const parsed = JSON.parse(String(reader.result));
      const data = parsed && parsed.data ? parsed.data : parsed;
      S = mergeWithDefaults(data);
      document.documentElement.dataset.theme = S.theme || 'dark';
      save(); render();
      toast('已导入', 'ok');
    } catch(err){
      toast('导入失败：' + err.message, 'err');
    }
  };
  reader.readAsText(file);
  e.target.value = '';
});

function openDirModal(id){
  const existing = id ? dirById(id) : null;
  openModal({
    title: existing ? '编辑方向' : '新建方向',
    submitText: existing ? '保存' : '创建',
    values: existing ? {
      name: existing.name, emoji: existing.emoji || '◇',
      tags: (existing.tags || []).join(', '), blurb: existing.blurb || ''
    } : { emoji: '◇' },
    fields: [
      { key:'name',  label:'名称', type:'text', required:true, placeholder:'例如：Computational Display' },
      { key:'emoji', label:'图标', type:'text', placeholder:'一个 emoji' },
      { key:'tags',  label:'标签', type:'text', placeholder:'用逗号分隔', hint:'例如：Light Field, Holographic' },
      { key:'blurb', label:'一句话描述', type:'textarea', placeholder:'这个方向在解决什么问题？' }
    ],
    onSubmit: data => {
      if (existing){
        existing.name = data.name.trim();
        existing.emoji = data.emoji || '◇';
        existing.tags = data.tags.split(',').map(x => x.trim()).filter(Boolean);
        existing.blurb = data.blurb || '';
      } else {
        S.directions.push({
          id: uid('d'),
          name: data.name.trim(),
          emoji: data.emoji || '◇',
          tags: data.tags.split(',').map(x => x.trim()).filter(Boolean),
          blurb: data.blurb || '',
          scores: { interest:3, curiosity:3, continue:3, build:3, math:3, research:3, product:3, career:3 },
          log: []
        });
      }
      save(); render();
      toast(existing ? '已保存' : '已创建', 'ok');
    }
  });
}

/* ============================================================
   命令面板
   ============================================================ */
let paletteItems = [];
let paletteSel = 0;

function openPalette(){
  const items = [];
  Object.keys(TITLES).filter(k => k !== 'direction').forEach(k => {
    items.push({ label: TITLES[k][0], hint: '页面', ico: '▸', route: k });
  });
  S.directions.forEach(d => {
    items.push({ label: d.name, hint: '方向', ico: d.emoji || '◇', route: 'direction/' + d.id });
  });
  items.push({ label: S.theme === 'dark' ? '切换到浅色模式' : '切换到深色模式', hint: '外观', ico: '◐', action:'theme' });

  paletteItems = items;
  paletteSel = 0;

  let layer = $('#paletteLayer');
  if (!layer){
    layer = document.createElement('div');
    layer.id = 'paletteLayer';
    layer.style.cssText = 'position:fixed;inset:0;z-index:100;display:none;align-items:flex-start;justify-content:center;padding-top:14vh;background:rgba(0,0,0,.55);backdrop-filter:blur(3px)';
    layer.innerHTML = `
      <div style="width:min(520px,92vw);border-radius:var(--r-lg);border:1px solid var(--border-strong);background:var(--panel);box-shadow:var(--shadow-lg);overflow:hidden">
        <input id="paletteInput" placeholder="跳转到页面或方向…" autocomplete="off" spellcheck="false" style="width:100%;padding:15px 17px;border:none;background:transparent;font-size:14.5px;border-bottom:1px solid var(--border);outline:none;color:inherit">
        <div id="paletteList" style="max-height:320px;overflow-y:auto;padding:6px"></div>
      </div>`;
    layer.addEventListener('click', e => { if (e.target === layer) closePalette(); });
    document.body.appendChild(layer);

    layer.querySelector('#paletteInput').addEventListener('input', e => {
      paletteSel = 0;
      renderPaletteList(e.target.value);
    });
  }
  layer.style.display = 'flex';
  layer.querySelector('#paletteInput').value = '';
  renderPaletteList('');
  setTimeout(() => layer.querySelector('#paletteInput').focus(), 20);
}

function closePalette(){
  const layer = $('#paletteLayer');
  if (layer) layer.style.display = 'none';
}

function renderPaletteList(q){
  const filtered = paletteItems.filter(i => i.label.toLowerCase().includes(q.toLowerCase()));
  const html = filtered.length
    ? filtered.map(i => {
        const idx = paletteItems.indexOf(i);
        return `<button data-pi="${idx}" style="display:flex;align-items:center;gap:10px;width:100%;padding:9px 11px;border-radius:var(--r-sm);font-size:13px;color:var(--text-2);text-align:left;${idx === paletteSel ? 'background:var(--panel-2);color:var(--text)' : ''}">
          <span style="width:16px;text-align:center;font-size:12px;opacity:.8">${i.ico}</span>
          <span>${esc(i.label)}</span>
          <span style="margin-left:auto;font-size:11px;color:var(--text-3);font-family:var(--mono)">${i.hint}</span>
        </button>`;
      }).join('')
    : '<div class="empty" style="margin:8px">没有匹配项</div>';
  $('#paletteList').innerHTML = html;
}

document.addEventListener('keydown', e => {
  const layer = $('#paletteLayer');
  if (!layer || layer.style.display !== 'flex') return;
  const q = $('#paletteInput').value;
  const filtered = paletteItems.filter(i => i.label.toLowerCase().includes(q.toLowerCase()));
  if (e.key === 'ArrowDown'){ e.preventDefault(); paletteSel = Math.min(filtered.length - 1, paletteSel + 1); renderPaletteList(q); }
  if (e.key === 'ArrowUp'){ e.preventDefault(); paletteSel = Math.max(0, paletteSel - 1); renderPaletteList(q); }
  if (e.key === 'Enter' && filtered[paletteSel]){
    e.preventDefault();
    runPalette(paletteItems.indexOf(filtered[paletteSel]));
  }
});

document.addEventListener('click', e => {
  const b = e.target.closest('[data-pi]');
  if (b){
    runPalette(Number(b.dataset.pi));
  }
});

function runPalette(idx){
  const item = paletteItems[idx];
  if (!item) return;
  closePalette();
  if (item.action === 'theme'){
    S.theme = S.theme === 'dark' ? 'light' : 'dark';
    document.documentElement.dataset.theme = S.theme;
    save(); render();
    return;
  }
  go('#/' + item.route);
}

/* ============================================================
   启动
   ============================================================ */
function boot(){
  S = loadState();
  document.documentElement.dataset.theme = S.theme || 'dark';
  renderJourney();
  render();

  window.addEventListener('hashchange', render);
  window.addEventListener('resize', () => {
    $('#menuBtn').style.display = window.innerWidth <= 900 ? 'grid' : 'none';
  });
  $('#menuBtn').style.display = window.innerWidth <= 900 ? 'grid' : 'none';

  /* 启动时尝试从本地文件加载备份（若存在则优先使用） */
  fetch('/api/load').then(r => {
    if (!r.ok) throw new Error('no backup');
    return r.json();
  }).then(data => {
    /* 只有当 localStorage 是空的，才使用文件备份 */
    const hasLocal = localStorage.getItem(KEY);
    if (!hasLocal && data && typeof data === 'object'){
      S = mergeWithDefaults(data);
      document.documentElement.dataset.theme = S.theme || 'dark';
      save();
      renderJourney();
      render();
      toast('已从 explorer-data.json 恢复', 'ok');
    }
  }).catch(() => { /* 没有服务器时忽略 */ });
}
boot();
