<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Explorer · 我的方向探索工作台</title>
<style>
/* ============================================================
   DESIGN TOKENS
   ============================================================ */
:root{
  color-scheme: dark;
  --bg:#08090a;
  --bg-elev:#0b0c0e;
  --panel:#101113;
  --panel-2:#15161a;
  --panel-3:#1b1d21;
  --border:rgba(255,255,255,.07);
  --border-strong:rgba(255,255,255,.13);
  --text:#eceef1;
  --text-2:#9aa0a8;
  --text-3:#6a6f78;
  --accent:#6f7bf7;
  --accent-hover:#828bf9;
  --accent-soft:rgba(111,123,247,.14);
  --accent-line:rgba(111,123,247,.35);
  --track:rgba(255,255,255,.08);
  --ok:#4ecb8b;
  --warn:#e8b04e;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 12px 32px -16px rgba(0,0,0,.7);
  --shadow-sm:0 1px 2px rgba(0,0,0,.3);
  --r-lg:14px;
  --r-md:10px;
  --r-sm:7px;
  --sidebar-w:238px;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI","Inter","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono","JetBrains Mono","Cascadia Code",Menlo,Consolas,monospace;
}
:root[data-theme="light"]{
  color-scheme: light;
  --bg:#fbfbfc;
  --bg-elev:#f6f6f8;
  --panel:#ffffff;
  --panel-2:#f7f7f9;
  --panel-3:#f1f1f4;
  --border:rgba(15,18,25,.08);
  --border-strong:rgba(15,18,25,.16);
  --text:#15171c;
  --text-2:#5c6270;
  --text-3:#878d99;
  --accent:#5a67e8;
  --accent-hover:#4a57d8;
  --accent-soft:rgba(90,103,232,.10);
  --accent-line:rgba(90,103,232,.35);
  --track:rgba(15,18,25,.07);
  --shadow:0 1px 2px rgba(16,24,40,.05), 0 12px 28px -18px rgba(16,24,40,.28);
  --shadow-sm:0 1px 2px rgba(16,24,40,.06);
}

/* ============================================================
   BASE
   ============================================================ */
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:var(--font);
  font-size:14px;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
::selection{background:var(--accent-soft)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:99px;border:3px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:var(--text-3);background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}

/* ============================================================
   LAYOUT
   ============================================================ */
.app{display:flex;min-height:100vh;min-height:100dvh}
.scrim{
  position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:50;
  opacity:0;pointer-events:none;transition:opacity .22s ease;
  backdrop-filter:blur(2px);
}

/* ---------- SIDEBAR ---------- */
.sidebar{
  width:var(--sidebar-w);flex:0 0 var(--sidebar-w);
  position:sticky;top:0;height:100vh;height:100dvh;
  display:flex;flex-direction:column;
  background:var(--bg-elev);
  border-right:1px solid var(--border);
  padding:14px 10px 10px;
  overflow-y:auto;overscroll-behavior:contain;
}
.brand{display:flex;align-items:center;gap:9px;padding:6px 8px 14px}
.brand-mark{
  width:26px;height:26px;flex:0 0 26px;border-radius:8px;
  background:linear-gradient(140deg,var(--accent),#a06ff7);
  display:grid;place-items:center;color:#fff;font-size:13px;font-weight:700;
  box-shadow:0 2px 10px -2px var(--accent);
}
.brand-text{min-width:0}
.brand-title{font-size:13.5px;font-weight:600;letter-spacing:-.01em;line-height:1.2}
.brand-sub{font-size:10.5px;color:var(--text-3);letter-spacing:.04em;font-family:var(--mono)}

.nav-group{margin-top:14px}
.nav-label{
  font-size:10px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;
  color:var(--text-3);padding:0 9px;margin-bottom:5px;
}
.nav-item{
  display:flex;align-items:center;gap:9px;width:100%;
  padding:6.5px 9px;border-radius:var(--r-sm);
  font-size:13.5px;color:var(--text-2);
  transition:background .13s ease,color .13s ease;
  text-align:left;
}
.nav-item:hover{background:var(--panel-2);color:var(--text)}
.nav-item[aria-current="page"]{background:var(--panel-3);color:var(--text);font-weight:500}
.nav-item[aria-current="page"] .nav-dot{background:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.nav-dot{
  width:5px;height:5px;flex:0 0 5px;border-radius:99px;
  background:var(--border-strong);transition:background .13s ease,box-shadow .13s ease;
}
.nav-ico{width:15px;text-align:center;font-size:12.5px;opacity:.85;flex:0 0 15px}
.nav-count{margin-left:auto;font-size:10.5px;color:var(--text-3);font-family:var(--mono);font-variant-numeric:tabular-nums}

.sidebar-foot{margin-top:auto;padding-top:16px}
.journey{
  border:1px solid var(--border);border-radius:var(--r-md);
  background:var(--panel);padding:11px 12px;
}
.journey-head{
  display:flex;justify-content:space-between;align-items:baseline;
  font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-3);
  font-weight:600;margin-bottom:9px;
}
.week-row{display:flex;align-items:center;gap:8px;padding:3.5px 0;font-size:12px;color:var(--text-3)}
.week-row.is-done{color:var(--text-2)}
.week-row.is-active{color:var(--text);font-weight:500}
.week-dot{
  width:6px;height:6px;border-radius:99px;background:var(--track);
  border:1px solid var(--border-strong);flex:0 0 6px;
}
.week-row.is-done .week-dot{background:var(--text-3);border-color:transparent}
.week-row.is-active .week-dot{background:var(--accent);border-color:transparent;box-shadow:0 0 0 3px var(--accent-soft)}
.week-name{font-family:var(--mono);font-size:10.5px;letter-spacing:.03em}

/* ---------- MAIN ---------- */
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{
  position:sticky;top:0;z-index:30;
  display:flex;align-items:center;gap:12px;
  padding:12px 26px;
  border-bottom:1px solid var(--border);
  background:rgba(8,9,10,.78);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
}
:root[data-theme="light"] .topbar{background:rgba(251,251,252,.82)}
.crumb{display:flex;align-items:baseline;gap:10px;min-width:0}
.crumb-title{font-size:14px;font-weight:600;letter-spacing:-.01em;white-space:nowrap}
.crumb-sub{font-size:12px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar-actions{margin-left:auto;display:flex;align-items:center;gap:7px}
.view{
  padding:30px 26px 90px;
  width:100%;max-width:1080px;margin:0 auto;flex:1;
}

/* ============================================================
   PRIMITIVES
   ============================================================ */
.card{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:var(--r-lg);
  padding:18px;
  box-shadow:var(--shadow-sm);
}
.card.pad-lg{padding:22px}
.card.flat{box-shadow:none}
.card-hover{transition:border-color .16s ease,background .16s ease,transform .16s ease}
.card-hover:hover{border-color:var(--border-strong);background:var(--panel-2)}

.btn{
  display:inline-flex;align-items:center;gap:6px;
  padding:6.5px 12px;border-radius:var(--r-sm);
  font-size:13px;font-weight:500;
  border:1px solid var(--border-strong);
  background:var(--panel-2);color:var(--text);
  transition:background .13s ease,border-color .13s ease,opacity .13s ease;
  white-space:nowrap;
}
.btn:hover{background:var(--panel-3);border-color:var(--text-3)}
.btn.primary{background:var(--accent);border-color:transparent;color:#fff}
.btn.primary:hover{background:var(--accent-hover)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--text-2)}
.btn.ghost:hover{background:var(--panel-2);color:var(--text)}
.btn.sm{padding:4.5px 9px;font-size:12px}
.icon-btn{
  width:30px;height:30px;display:grid;place-items:center;
  border-radius:var(--r-sm);border:1px solid transparent;
  color:var(--text-2);font-size:13px;
  transition:background .13s ease,color .13s ease,border-color .13s ease;
}
.icon-btn:hover{background:var(--panel-2);color:var(--text);border-color:var(--border)}
.kbd{
  font-family:var(--mono);font-size:10.5px;
  padding:2px 5px;border-radius:5px;
  border:1px solid var(--border);background:var(--panel-2);color:var(--text-3);
}

.tag{
  display:inline-flex;align-items:center;gap:5px;
  padding:2.5px 8px;border-radius:99px;
  font-size:11px;font-weight:500;
  background:var(--panel-2);border:1px solid var(--border);color:var(--text-2);
  white-space:nowrap;
}
.tag.accent{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.tag .tdot{width:5px;height:5px;border-radius:99px;background:currentColor;opacity:.9}

.label{
  font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
  color:var(--text-3);
}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}

.section{margin-top:34px}
.section:first-child{margin-top:0}
.section-head{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  margin-bottom:12px;
}
.section-title{font-size:13px;font-weight:600;letter-spacing:-.005em}
.section-sub{font-size:12px;color:var(--text-3);margin-top:1px}

.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.row{display:flex;align-items:center;gap:10px}
.spread{display:flex;align-items:center;justify-content:space-between;gap:12px}
.muted{color:var(--text-2)}
.dim{color:var(--text-3)}
.tiny{font-size:11.5px}
.sm{font-size:12.5px}
.stack{display:flex;flex-direction:column}

/* ---------- METER ---------- */
.meter{
  height:6px;border-radius:99px;background:var(--track);
  overflow:hidden;position:relative;
}
.meter > i{
  display:block;height:100%;border-radius:99px;
  background:linear-gradient(90deg,var(--accent),#9b7bf7);
  transform-origin:left center;
  animation:grow .68s cubic-bezier(.22,.8,.24,1) both;
}
.meter.thin{height:4px}
.meter.thick{height:8px}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}

/* ---------- STARS ---------- */
.stars{display:inline-flex;gap:1.5px;font-size:11.5px;letter-spacing:.5px;line-height:1}
.stars .on{color:var(--warn)}
.stars .off{color:var(--track)}
.stars.interactive{cursor:pointer}
.stars.interactive span{transition:transform .1s ease}
.stars.interactive span:hover{transform:scale(1.25)}

/* ---------- DOT SCALE ---------- */
.dots{display:inline-flex;gap:4px}
.dots i{width:8px;height:8px;border-radius:99px;background:var(--track);transition:background .15s ease}
.dots i.on{background:var(--accent)}
.dots.interactive i{cursor:pointer;transition:background .15s ease,transform .12s ease}
.dots.interactive i:hover{transform:scale(1.28)}

/* ---------- STAT ---------- */
.stat{
  background:var(--panel);border:1px solid var(--border);
  border-radius:var(--r-md);padding:13px 14px;
}
.stat-val{font-size:23px;font-weight:600;letter-spacing:-.025em;line-height:1.1;font-variant-numeric:tabular-nums}
.stat-lab{font-size:11.5px;color:var(--text-3);margin-top:3px}

/* ---------- HERO ---------- */
.hero{
  background:
    radial-gradient(120% 140% at 100% 0%, var(--accent-soft) 0%, transparent 55%),
    var(--panel);
  border:1px solid var(--border);
  border-radius:var(--r-lg);
  padding:26px 24px;
  box-shadow:var(--shadow-sm);
}
.hero h1{
  margin:0 0 8px;font-size:24px;font-weight:600;letter-spacing:-.028em;line-height:1.25;
}
.hero p{margin:0;color:var(--text-2);font-size:13.5px;max-width:52ch}

/* ---------- DIRECTION CARD ---------- */
.dir-card{
  background:var(--panel);border:1px solid var(--border);
  border-radius:var(--r-lg);padding:16px;
  display:flex;flex-direction:column;gap:13px;
  transition:border-color .16s ease,background .16s ease;
  cursor:pointer;text-align:left;width:100%;
}
.dir-card:hover{border-color:var(--border-strong);background:var(--panel-2)}
.dir-card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.dir-emoji{
  width:34px;height:34px;border-radius:10px;flex:0 0 34px;
  display:grid;place-items:center;font-size:17px;
  background:var(--panel-3);border:1px solid var(--border);
}
.dir-name{font-size:14.5px;font-weight:600;letter-spacing:-.012em}
.dir-tags{font-size:11.5px;color:var(--text-3);margin-top:2px;line-height:1.4}
.dir-score{font-size:19px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.dir-score span{font-size:11.5px;color:var(--text-3);font-weight:400}

.score-row{display:grid;grid-template-columns:56px 1fr auto;align-items:center;gap:9px;font-size:12px}
.score-row .k{color:var(--text-3)}
.score-row .v{color:var(--text-2);font-size:11px;font-family:var(--mono);font-variant-numeric:tabular-nums}

/* ---------- TIMELINE ---------- */
.tl{display:flex;flex-direction:column;gap:0}
.tl-item{display:grid;grid-template-columns:15px 1fr;gap:11px;position:relative;padding-bottom:15px}
.tl-item:last-child{padding-bottom:0}
.tl-item::before{
  content:"";position:absolute;left:6.5px;top:16px;bottom:-2px;width:1px;
  background:var(--border); 
}
.tl-item:last-child::before{display:none}
.tl-dot{
  width:7px;height:7px;border-radius:99px;margin-top:6px;
  background:var(--panel);border:1.5px solid var(--border-strong);z-index:1;
}
.tl-item.active .tl-dot{background:var(--accent);border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.tl-item.done .tl-dot{background:var(--text-3);border-color:var(--text-3)}
.tl-title{font-size:12.5px;font-weight:500}
.tl-meta{font-size:11.5px;color:var(--text-3);margin-top:1px}

/* ---------- ACTIVITY ---------- */
.act{display:flex;align-items:center;gap:11px;padding:8px 0;border-bottom:1px solid var(--border)}
.act:last-child{border-bottom:none}
.act-date{font-size:11px;color:var(--text-3);font-family:var(--mono);flex:0 0 68px;font-variant-numeric:tabular-nums}
.act-text{font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- TASK ---------- */
.task{
  display:flex;align-items:flex-start;gap:12px;
  padding:13px 15px;border-radius:var(--r-md);
  border:1px solid var(--border);background:var(--panel);
  transition:border-color .15s ease,opacity .15s ease;
}
.task:hover{border-color:var(--border-strong)}
.task.done{opacity:.5}
.task.done .task-title{text-decoration:line-through;text-decoration-color:var(--text-3)}
.check{
  width:17px;height:17px;flex:0 0 17px;margin-top:2px;border-radius:5px;
  border:1.5px solid var(--border-strong);display:grid;place-items:center;
  font-size:10px;color:transparent;transition:all .14s ease;
}
.check.on{background:var(--accent);border-color:var(--accent);color:#fff}
.task-kind{
  font-size:10px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;
  color:var(--text-3);font-family:var(--mono);
}
.task-title{font-size:13.5px;font-weight:500;margin-top:1px;letter-spacing:-.005em}
.task-min{font-size:11px;color:var(--text-3);font-family:var(--mono);margin-top:2px;font-variant-numeric:tabular-nums}

/* ---------- CALENDAR ---------- */
.cal-head{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:6px}
.cal-dow{
  font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
  color:var(--text-3);text-align:center;padding:5px 0;
}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal-cell{
  min-height:74px;border-radius:var(--r-md);
  border:1px solid var(--border);background:var(--panel);
  padding:7px 8px;text-align:left;
  display:flex;flex-direction:column;gap:5px;
  transition:border-color .14s ease,background .14s ease;
  position:relative;
}
.cal-cell.empty{background:transparent;border-color:transparent;pointer-events:none}
.cal-cell.has-plan{cursor:pointer}
.cal-cell.has-plan:hover{border-color:var(--border-strong);background:var(--panel-2)}
.cal-cell.today{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent-soft)}
.cal-cell.today .cal-date{color:var(--accent);font-weight:600}
.cal-cell.active{background:var(--panel-3);border-color:var(--border-strong)}
.cal-date{font-size:11.5px;color:var(--text-3);font-family:var(--mono);font-variant-numeric:tabular-nums}
.cal-pill{
  display:inline-flex;align-items:center;gap:4px;
  font-size:10.5px;padding:2px 6px;border-radius:5px;
  background:var(--panel-3);color:var(--text-2);
  max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  border:1px solid var(--border);
}
.cal-pill .pd{width:4px;height:4px;border-radius:99px;flex:0 0 4px}
.cal-theme{font-size:10.5px;color:var(--text-3);line-height:1.3;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.cal-today-flag{
  position:absolute;top:6px;right:7px;
  font-size:9px;font-weight:700;letter-spacing:.06em;
  color:var(--accent);
}

/* ---------- TABLE ---------- */
.tbl-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--r-lg);background:var(--panel)}
table.tbl{width:100%;border-collapse:collapse;font-size:12.5px;min-width:620px}
table.tbl th{
  text-align:left;padding:10px 12px;font-size:10.5px;font-weight:600;
  letter-spacing:.06em;text-transform:uppercase;color:var(--text-3);
  border-bottom:1px solid var(--border);white-space:nowrap;
  background:var(--panel-2);position:sticky;top:0;
}
table.tbl th.c,table.tbl td.c{text-align:center}
table.tbl td{padding:9px 12px;border-bottom:1px solid var(--border)}
table.tbl tr:last-child td{border-bottom:none}
table.tbl tbody tr:hover{background:var(--panel-2)}
.cell-score{
  display:inline-grid;place-items:center;width:24px;height:24px;border-radius:6px;
  font-family:var(--mono);font-size:11.5px;font-variant-numeric:tabular-nums;
  background:var(--panel-3);color:var(--text-2);cursor:pointer;
  transition:background .12s ease,color .12s ease;
  border:1px solid transparent;
}
.cell-score:hover{border-color:var(--border-strong);color:var(--text)}
.cell-score.hi{background:var(--accent-soft);color:var(--accent)}
.cell-score.mid{background:rgba(232,176,78,.12);color:var(--warn)}

/* ---------- FORM ---------- */
.field{margin-bottom:14px}
.field:last-child{margin-bottom:0}
.field-lab{display:block;font-size:12px;font-weight:500;color:var(--text-2);margin-bottom:6px}
.field-hint{font-size:11px;color:var(--text-3);margin-top:5px}
.input,.textarea{
  width:100%;padding:9px 11px;border-radius:var(--r-sm);
  background:var(--panel-2);border:1px solid var(--border);
  font-size:13px;line-height:1.55;
  transition:border-color .14s ease,background .14s ease;
}
.input::placeholder,.textarea::placeholder{color:var(--text-3)}
.input:focus,.textarea:focus{
  outline:none;border-color:var(--accent);background:var(--panel);
  box-shadow:0 0 0 3px var(--accent-soft);
}
.textarea{resize:vertical;min-height:74px;font-family:var(--font)}
select.input{cursor:pointer;appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,var(--text-3) 50%),linear-gradient(135deg,var(--text-3) 50%,transparent 50%);
  background-position:calc(100% - 15px) 50%,calc(100% - 10px) 50%;
  background-size:5px 5px,5px 5px;background-repeat:no-repeat;
  padding-right:30px;
}

/* ---------- EXPERIMENT ---------- */
.exp{
  background:var(--panel);border:1px solid var(--border);
  border-radius:var(--r-lg);padding:16px;
  display:flex;flex-direction:column;gap:12px;
}
.exp-title{font-size:14px;font-weight:600;letter-spacing:-.01em}
.exp-block{border-left:2px solid var(--border);padding-left:11px}

  display:flex;flex-direction:column;gap:11px;
}
.career-name{font-size:14px;font-weight:600;letter-spacing:-.01em}

/* ---------- RESEARCH ---------- */
.q-item{
  display:flex;align-items:flex-start;gap:12px;
  padding:13px 15px;border:1px solid var(--border);border-radius:var(--r-md);
  background:var(--panel);transition:border-color .14s ease;
}
.q-item:hover{border-color:var(--border-strong)}
.q-text{font-size:13.5px;line-height:1.5;letter-spacing:-.005em}
.status-pill{
  font-size:10.5px;padding:2.5px 8px;border-radius:99px;font-weight:500;
  border:1px solid var(--border);background:var(--panel-2);color:var(--text-2);
  white-space:nowrap;flex:0 0 auto;
}
.status-pill.s-curious{color:var(--accent);background:var(--accent-soft);border-color:transparent}
.status-pill.s-doing{color:var(--warn);background:rgba(232,176,78,.12);border-color:transparent}
.status-pill.s-done{color:var(--ok);background:rgba(78,203,139,.12);border-color:transparent}

/* ---------- DECISION TREE ---------- */
.tree{display:flex;flex-direction:column;align-items:center;padding:8px 0 4px;overflow-x:auto}
.tree-node{
  border:1px solid var(--border-strong);background:var(--panel);
  border-radius:var(--r-md);padding:9px 15px;text-align:center;
  box-shadow:var(--shadow-sm);
}
.tree-root{border-color:var(--accent);background:var(--accent-soft)}
.tree-root .tn-title{color:var(--accent);font-weight:600}
.tn-title{font-size:13px;font-weight:600;letter-spacing:-.01em;white-space:nowrap}
.tn-sub{font-size:11px;color:var(--text-3);margin-top:2px;white-space:nowrap}
.tree-vline{width:1px;height:20px;background:var(--border-strong)}
.tree-branch{display:flex;gap:34px;position:relative;padding-top:20px}
.tree-branch::before{
  content:"";position:absolute;top:0;left:50%;transform:translateX(-50%);
  width:calc(100% - 120px);height:1px;background:var(--border-strong);
}
.tree-branch::after{
  content:"";position:absolute;top:0;left:50%;transform:translateX(-50%);
  width:1px;height:20px;background:var(--border-strong);
}
.tree-col{display:flex;flex-direction:column;align-items:center;gap:0;position:relative;padding-top:20px}
.tree-col::before{
  content:"";position:absolute;top:0;left:50%;width:1px;height:20px;background:var(--border-strong);
}

/* ---------- TOP3 ---------- */
.rank-card{
  display:flex;align-items:center;gap:14px;
  border:1px solid var(--border);border-radius:var(--r-lg);
  background:var(--panel);padding:15px 16px;
}
.rank-num{
  font-size:11px;font-weight:700;font-family:var(--mono);

.rank-card.top1{border-color:var(--accent-line);background:linear-gradient(120deg,var(--accent-soft),transparent 60%),var(--panel)}
.rank-card.top1 .rank-num{color:var(--accent)}

/* ---------- EMPTY ---------- */
.empty{
  border:1px dashed var(--border-strong);border-radius:var(--r-md);
  padding:26px;text-align:center;color:var(--text-3);font-size:12.5px;

/* ---------- CMDK ---------- */
.cmdk{

@keyframes pop{from{opacity:0;transform:translateY(-6px) scale(.985)}to{opacity:1;transform:none}}
.cmdk-input{
  width:100%;padding:15px 17px;border:none;background:transparent;

.cmdk-input:focus{outline:none}
.cmdk-list{max-height:320px;overflow-y:auto;padding:6px}
.cmdk-item{

.cmdk-item:hover,.cmdk-item.sel{background:var(--panel-2);color:var(--text)}

function pad2(n){ return String(n).padStart(2, '0'); }
function isoOf(d){ return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
function parseISO(s){ const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); }

function prettyDate(s){
  const d = parseISO(s);

}
function prettyFull(s){
  const d = parseISO(s);
  const wd = ['周日','周一','周二','周三','周四','周五','周六'][d.getDay()];

const KEY = 'obsidian-explorer-v1';
let S;

function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if (!raw) return defaultState();
    const parsed = JSON.parse(raw);
    const base = defaultState();
    return Object.assign(base, parsed, {
      calView: Object.assign(base.calView, parsed.calView || {}),
      decision: Object.assign(base.decision, parsed.decision || {})
    });
  } catch(e){
    console.warn('状态读取失败，使用默认值', e);
    return defaultState();
  }
}
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(S)); }
  catch(e){ console.warn('状态保存失败', e); }
}

/* ---- helpers over state ---- */
function dirById(id){ return S.directions.find(d => d.id === id); }
function dirScore(d){
  const vals = SCORE_KEYS.map(x => d.scores[x.k] || 0);
  return vals.reduce((a, b) => a + b, 0) / vals.length;
}
function sortedDirections(){
  return S.directions.slice().sort((a, b) => dirScore(b) - dirScore(a));
}
function getDay(date){
  if (!S.daily[date]) S.daily[date] = { done:{}, discover:'', best:'', worst:'', keep:0, conclusion:'' };
  return S.daily[date];
}
function allActivity(){
  const items = [];
  S.directions.forEach(d => (d.log || []).forEach(l => items.push({ d:l.d, t:l.t, dir:d.id })));
  S.experiments.forEach(x => {
    if (x.date) items.push({ d:x.date, t:x.title, dir:x.dir });
  });
  items.sort((a, b) => b.d.localeCompare(a.d));
  return items.slice(0, 8);
}
function experimentCount(){ return S.experiments.length; }
function activeDirectionCount(){ return S.directions.filter(d => dirScore(d) >= 4).length; }

function parseHash(){
  const h = location.hash.replace(/^#\/?/, '');
  const parts = h.split('/').filter(Boolean);
  return { name: parts[0] || 'dashboard', param: parts.slice(1).join('/') };
}
function go(hash){ location.hash = hash; }

const TITLES = {
  dashboard:  ['Dashboard', '找到一个值得投入 3 年的方向'],
  today:      ['今日探索', '今天干什么'],
  calendar:   ['月历', '4 周探索计划'],

  decision:   ['最终决策', '基于证据的暂时决策']
};

function render(){
  const { name, param } = parseHash();
  const view = $('#view');

  let html = '';
  switch(name){
    case 'today':       html = renderToday(); break;
    case 'calendar':    html = renderCalendar(); break;
    case 'experiments': html = renderExperiments(); break;
    case 'directions':  html = renderDirections(); break;
    case 'direction':   html = renderDirectionDetail(param); break;
    case 'career':      html = renderCareer(); break;
    case 'research':    html = renderResearch(); break;
    case 'decision':    html = renderDecision(); break;
    default:            html = renderDashboard();
  }
  view.innerHTML = html;

  // crumb
  const t = TITLES[name] || TITLES.dashboard;
  $('#crumbTitle').textContent = t[0];
  let sub = t[1];
  if (name === 'direction'){
    const d = dirById(param);
    sub = d ? d.tags.join(' · ') : '';
    $('#crumbTitle').textContent = d ? d.name : '方向详情';
  }
  $('#crumbSub').textContent = sub;

  // nav highlight
  $$('#nav .nav-item').forEach(b => {
    const r = b.dataset.route;
    const on = (r === name) || (name === 'direction' && r === 'directions');
    if (on) b.setAttribute('aria-current', 'page');
    else b.removeAttribute('aria-current');
  });

  // counts
  $('#navExpCount').textContent = experimentCount();
  $('#navDirCount').textContent = S.directions.length;
  $('#navQCount').textContent = S.research.length;

  // close mobile nav
  $('#app').classList.remove('nav-open');
  window.scrollTo({ top: 0, behavior: 'auto' });
}

    return `<div class="week-row ${cls}">

function weekProgress(){
  const start = parseISO(S.startDate);
  const elapsed = daysBetween(S.startDate, TODAY);
  return clamp(elapsed / 28, 0, 1);
}

/* ---------- CALENDAR ---------- */
function renderCalendar(){
  const { y, m } = S.calView;
  const first = new Date(y, m, 1);
  const startDow = (first.getDay() + 6) % 7; // Monday first
  const daysInMonth = new Date(y, m + 1, 0).getDate();

  const cells = [];
  for (let i = 0; i < startDow; i++) cells.push('<div class="cal-cell empty"></div>');
  for (let d = 1; d <= daysInMonth; d++){
    const dateStr = `${y}-${pad2(m+1)}-${pad2(d)}`;
    const plan = PLAN[dateStr];
    const isToday = dateStr === TODAY;
    const isActive = dateStr === S.activeDay;
    const cls = ['cal-cell', plan ? 'has-plan' : '', isToday ? 'today' : '', isActive ? 'active' : ''].filter(Boolean).join(' ');
    cells.push(`<div class="${cls}" ${plan ? `data-action="open-day" data-date="${dateStr}"` : ''} role="${plan ? 'button' : 'gridcell'}" tabindex="${plan ? 0 : -1}">
      ${isToday ? '<span class="cal-today-flag">TODAY</span>' : ''}
      <span class="cal-date">${d}</span>
      ${plan ? `<span class="cal-pill"><span class="pd" style="background:${dirColor(plan.dir)}"></span>${esc(plan.label)}</span>
      <span class="cal-theme">${esc(plan.theme)}</span>` : ''}
    </div>`);
  }

  const monthName = first.toLocaleDateString('zh-CN', { year:'numeric', month:'long' });

  return `
  <div class="spread" style="margin-bottom:16px">
    <div>
      <div class="label">MONTHLY CALENDAR</div>
      <h2 style="margin:6px 0 0;font-size:20px;font-weight:600;letter-spacing:-.025em">${monthName}</h2>
    </div>
    <div class="row" style="gap:6px">
      <button class="btn ghost sm" data-action="cal-prev">←</button>
      <button class="btn ghost sm" data-action="cal-now">本月</button>
      <button class="btn ghost sm" data-action="cal-next">→</button>
    </div>
  </div>

  <div class="card" style="padding:14px">
    <div class="cal-head">
      ${['MON','TUE','WED','THU','FRI','SAT','SUN'].map(d => `<div class="cal-dow">${d}</div>`).join('')}
    </div>
    <div class="cal-grid">${cells.join('')}</div>
  </div>

  <section class="section">
    <div class="section-head">
      <div>
        <div class="section-title">4 周结构</div>
        <div class="section-sub">每周有一个明确的目的，不是一个待办清单</div>
      </div>
    </div>
    <div class="grid g2">
      ${WEEKS.map(w => {
        const days = Object.keys(PLAN).filter(d => d >= w.from && d <= w.to).sort();
        return `<div class="card">
          <div class="row" style="gap:9px;margin-bottom:9px">
            <span class="tag accent">WEEK ${w.n}</span>
            <span class="sm" style="font-weight:500">${esc(w.name)}</span>
          </div>
          <div class="stack" style="gap:5px">
            ${days.map(d => {
              const p = PLAN[d];
              return `<button class="row" style="gap:8px;width:100%;text-align:left;padding:3px 0" data-action="open-day" data-date="${d}">
                <span class="tiny mono dim" style="flex:0 0 44px">${d.slice(5)}</span>
                <span style="width:5px;height:5px;border-radius:99px;background:${dirColor(p.dir)};flex:0 0 5px"></span>
                <span class="tiny muted" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(p.theme)}</span>
              </button>`;
            }).join('')}
          </div>
        </div>`;
      }).join('')}
    </div>
  </section>
  `;
}

/* ============================================================
   8. ACTIONS
   ============================================================ */
document.addEventListener('click', e => {
  const routeEl = e.target.closest('[data-route]');
  if (routeEl){ go('#/' + routeEl.dataset.route); return; }

  const el = e.target.closest('[data-action]');
  if (!el) return;
  const a = el.dataset.action;

  switch(a){
    case 'toggle-nav':
      $('#app').classList.toggle('nav-open');
      break;
    case 'close-nav':
      $('#app').classList.remove('nav-open');
      break;

    case 'toggle-theme': {
      S.theme = S.theme === 'dark' ? 'light' : 'dark';
      document.documentElement.dataset.theme = S.theme;
      save();
      render();
      break;
    }

    case 'palette':      openPalette(); break;
    case 'palette-close': closePalette(); break;

    case 'open-dir':
      go('#/direction/' + el.dataset.id);
      break;

    case 'open-day':
      S.activeDay = el.dataset.date;
      save();
      go('#/today');
      break;

    case 'jump-today':
      S.activeDay = PLAN[TODAY] ? TODAY : '2026-09-11';
      save(); render();
      break;

    case 'prev-day': {
      const dates = Object.keys(PLAN).sort();
      const i = dates.indexOf(S.activeDay);
      S.activeDay = dates[Math.max(0, i - 1)] || dates[0];
      save(); render();
      break;
    }
    case 'next-day': {
      const dates = Object.keys(PLAN).sort();
      const i = dates.indexOf(S.activeDay);
      S.activeDay = dates[Math.min(dates.length - 1, i + 1)] || dates[dates.length - 1];
      save(); render();
      break;
    }

    case 'cal-prev': {
      let { y, m } = S.calView;
      m--; if (m < 0){ m = 11; y--; }
      S.calView = { y, m }; save(); render();
      break;
    }
    case 'cal-next': {
      let { y, m } = S.calView;
      m++; if (m > 11){ m = 0; y++; }
      S.calView = { y, m }; save(); render();
      break;
    }
    case 'cal-now':
      S.calView = { y: 2026, m: 8 }; save(); render();
      break;

    case 'toggle-task': {
      const date = el.dataset.date, idx = el.dataset.idx;
      const day = getDay(date);
      day.done[idx] = !day.done[idx];
      save(); render();
      break;
    }

    case 'set-keep': {
      const v = Number(el.dataset.value);
      const date = el.dataset.date;
      getDay(date).keep = v;
      save(); render();
      break;
    }

    case 'save-day': {
      const date = el.dataset.date;
      save();
      const hint = $('#saveHint');
      if (hint){ hint.textContent = '已保存 ✓'; setTimeout(() => { hint.textContent = ''; }, 1800); }
      break;
    }

    case 'add-log': {
      const date = el.dataset.date;
      const day = getDay(date);
      const plan = PLAN[date];
      const dir = plan ? dirById(plan.dir) : null;
      const target = dir || sortedDirections()[0];
      const text = day.discover || (plan ? plan.theme : '一次探索');
      target.log = target.log || [];
      target.log.unshift({ d: date, t: text });
      save(); render();
      const hint = $('#saveHint');
      if (hint){ hint.textContent = '已记入 ' + target.name + ' ✓'; setTimeout(() => { hint.textContent = ''; }, 1800); }
      break;
    }

    case 'bump-score': {
      const d = dirById(el.dataset.id);
      const k = el.dataset.key;
      d.scores[k] = (d.scores[k] || 0) >= 5 ? 1 : (d.scores[k] || 0) + 1;
      save(); render();
      break;
    }

    case 'set-score': {
      const d = dirById(el.dataset.id);
      const k = el.dataset.key;
      const v = Number(e.target.dataset.value);
      if (v) { d.scores[k] = v; save(); render(); }
      break;
    }

    case 'cycle-exp': {
      const x = S.experiments.find(v => v.id === el.dataset.id);
      const order = ['planned', 'doing', 'done'];
      x.status = order[(order.indexOf(x.status) + 1) % 3];
      save(); render();
      break;
    }

    case 'new-exp': showNewExpForm(); break;
    case 'create-exp': createExp(); break;
    case 'cancel-form': render(); break;

    case 'new-dir': {
      const name = prompt('新方向名称：');
      if (!name) return;
      const id = 'd' + Date.now();
      S.directions.push({
        id, name: name.trim(), emoji:'◇', tags:['自定义'], blurb:'',
        scores:{ interest:3, curiosity:3, continue:3, build:3, math:3, research:3, product:3, career:3 },
        log:[]
      });
      save(); render();
      break;
    }

    case 'new-log': {
      const d = dirById(el.dataset.id);
      const t = prompt('记录这次探索：');
      if (!t) return;
      d.log = d.log || [];
      d.log.unshift({ d: TODAY, t: t.trim() });
      save(); render();
      break;
    }

    case 'new-q': showNewQForm(); break;
    case 'create-q': createQ(); break;

    case 'cycle-q': {
      const q = S.research.find(v => v.q === el.dataset.q);
      const order = ['curious', 'doing', 'done'];
      q.status = order[(order.indexOf(q.status) + 1) % 3];
      save(); render();
      break;
    }

    case 'save-decision':
      save();
      {
        const h = $('#decHint');
        if (h){ h.textContent = '已保存 ✓'; setTimeout(() => { h.textContent = ''; }, 1800); }
      }
      break;
  }
});

/* keyboard on task rows */
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' || e.key === ' '){
    const t = e.target.closest('.task');
    if (t){ e.preventDefault(); t.click(); }
    const c = e.target.closest('.cal-cell.has-plan');
    if (c){ e.preventDefault(); c.click(); }
  }
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k'){
    e.preventDefault();
    const box = $('#cmdk');
    if (box.classList.contains('open')) closePalette(); else openPalette();
  }
  if (e.key === 'Escape') closePalette();
});

/* inputs */
document.addEventListener('input', e => {
  const f = e.target.closest('[data-field]');
  if (f){
    const date = f.dataset.date;
    const day = getDay(date);
    day[f.dataset.field] = f.value;
    save();
    return;
  }
  const dd = e.target.closest('[data-decision]');
  if (dd){
    S.decision[dd.dataset.decision] = dd.value;
    save();
    return;
  }
});

/* ============================================================
   10. COMMAND PALETTE
   ============================================================ */
let paletteItems = [];
let paletteSel = 0;

function openPalette(){
  const items = [];
  Object.keys(TITLES).filter(k => k !== 'direction').forEach(k => {
    items.push({ label: TITLES[k][0], hint: '页面', ico: '▸', route: k });
  });
  S.directions.forEach(d => {
    items.push({ label: d.name, hint: '方向', ico: '◇', route: 'direction/' + d.id });
  });
  items.push({ label: S.theme === 'dark' ? '切换到浅色模式' : '切换到深色模式', hint: '外观', ico: '◐', action:'theme' });
  paletteItems = items;
  paletteSel = 0;
  $('#cmdk').classList.add('open');
  $('#cmdkInput').value = '';
  renderPaletteList('');
  setTimeout(() => $('#cmdkInput').focus(), 20);
}
function closePalette(){
  $('#cmdk').classList.remove('open');
}
function renderPaletteList(q){
  const filtered = paletteItems.filter(i => i.label.toLowerCase().includes(q.toLowerCase()));
  $('#cmdkList').innerHTML = filtered.length
    ? filtered.map((i, idx) => `<button class="cmdk-item ${idx === paletteSel ? 'sel' : ''}" data-pi="${paletteItems.indexOf(i)}">
        <span class="ci-ico">${i.ico}</span>
        <span>${esc(i.label)}</span>
        <span class="ci-hint">${i.hint}</span>
      </button>`).join('')
    : '<div class="empty" style="margin:8px">没有匹配项</div>';
}
$('#cmdkInput').addEventListener('input', e => {
  paletteSel = 0;
  renderPaletteList(e.target.value);
});
$('#cmdkList').addEventListener('click', e => {
  const b = e.target.closest('[data-pi]');
  if (!b) return;
  runPalette(Number(b.dataset.pi));
});
document.addEventListener('keydown', e => {
  if (!$('#cmdk').classList.contains('open')) return;
  const q = $('#cmdkInput').value;
  const filtered = paletteItems.filter(i => i.label.toLowerCase().includes(q.toLowerCase()));
  if (e.key === 'ArrowDown'){ e.preventDefault(); paletteSel = Math.min(filtered.length - 1, paletteSel + 1); renderPaletteList(q); }
  if (e.key === 'ArrowUp'){ e.preventDefault(); paletteSel = Math.max(0, paletteSel - 1); renderPaletteList(q); }
  if (e.key === 'Enter' && filtered[paletteSel]){
    e.preventDefault();
    runPalette(paletteItems.indexOf(filtered[paletteSel]));
  }
});
function runPalette(idx){
  const item = paletteItems[idx];
  if (!item) return;
  closePalette();
  if (item.action === 'theme'){
    S.theme = S.theme === 'dark' ? 'light' : 'dark';
    document.documentElement.dataset.theme = S.theme;
    save(); render();
    return;
  }
  go('#/' + item.route);
}
